
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลผู้เข้าร่วมวิจัย | NeckBackRelief.qn</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #253047;
    }

    header {
      background: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5eaf2;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .brand span {
      color: #5878e8;
    }

    .step {
      font-size: 13px;
      color: #667085;
    }

    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 18px;
    }

    .intro {
      margin-bottom: 24px;
    }

    .tag {
      color: #5878e8;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 12px;
    }

    .intro p {
      color: #667085;
      line-height: 1.8;
      font-size: 14px;
    }

    .card {
      background: white;
      border: 1px solid #e6eaf0;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(30, 50, 90, 0.05);
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      margin-bottom: 4px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .required {
      color: #e05252;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8deea;
      border-radius: 9px;
      font-size: 14px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: 2px solid #dce4ff;
      border-color: #5878e8;
    }

    .hint {
      color: #858da0;
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.6;
    }

    .consent {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 24px;
      padding: 15px;
      background: #f7f8fc;
      border-radius: 10px;
      font-size: 13px;
      font-weight: normal;
      line-height: 1.8;
    }

    .consent input {
      width: 17px;
      height: 17px;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 26px;
    }

    .btn {
      display: inline-block;
      padding: 13px 20px;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-back {
      color: #4b5568;
      background: #f0f2f7;
    }

    .btn-next {
      color: white;
      background: #5878e8;
    }

    .btn-next:hover {
      background: #4263d5;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      line-height: 1.8;
      font-size: 14px;
    }

    #message.success {
      display: block;
      background: #e9f8ef;
      color: #17683a;
    }

    #message.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #8a92a3;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        padding: 17px 20px;
      }

      main {
        margin: 26px auto;
      }

      .card {
        padding: 22px 17px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      h1 {
        font-size: 24px;
      }

      .actions {
        flex-direction: column-reverse;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">NeckBackRelief<span>.qn</span></div>
    <div class="step">ขั้นตอนที่ 1</div>
  </header>

  <main>
    <div class="intro">
      <div class="tag">PARTICIPANT REGISTRATION</div>
      <h1>ข้อมูลผู้เข้าร่วมวิจัย</h1>
      <p>
        กรุณากรอกข้อมูลพื้นฐานให้ครบถ้วน
        เพื่อใช้ประกอบการเข้าร่วมโปรแกรม NeckBackRelief
      </p>
    </div>

    <div class="card">
      <div class="section-title">ข้อมูลส่วนตัว</div>

      <form id="profileForm">
        <div class="grid">

          <div class="field">
            <label for="participantId">
              รหัสผู้เข้าร่วมวิจัย <span class="required">*</span>
            </label>
            <input
              type="text"
              id="participantId"
              name="participantId"
              placeholder="เช่น P001"
              required
            >
            <div class="hint">ควรใช้รหัสแทนชื่อจริง</div>
          </div>

          <div class="field">
            <label for="age">
              อายุ (ปี) <span class="required">*</span>
            </label>
            <input
              type="number"
              id="age"
              name="age"
              min="18"
              max="100"
              placeholder="ระบุอายุ"
              required
            >
          </div>

          <div class="field">
            <label for="gender">
              เพศ <span class="required">*</span>
            </label>
            <select id="gender" name="gender" required>
              <option value="">-- เลือกเพศ --</option>
              <option value="male">ชาย</option>
              <option value="female">หญิง</option>
              <option value="other">อื่น ๆ</option>
              <option value="undisclosed">ไม่ประสงค์ระบุ</option>
            </select>
          </div>

          <div class="field">
            <label for="occupation">อาชีพ</label>
            <select id="occupation" name="occupation">
              <option value="">-- เลือกอาชีพ --</option>
              <option value="student">นักเรียน/นักศึกษา</option>
              <option value="office">พนักงานสำนักงาน</option>
              <option value="factory">พนักงานโรงงาน</option>
              <option value="other">อื่น ๆ</option>
            </select>
          </div>

          <div class="field">
            <label for="height">ส่วนสูง (ซม.)</label>
            <input
              type="number"
              id="height"
              name="height"
              min="100"
              max="250"
              step="0.1"
              placeholder="เช่น 165"
            >
          </div>

          <div class="field">
            <label for="weight">น้ำหนัก (กก.)</label>
            <input
              type="number"
              id="weight"
              name="weight"
              min="20"
              max="300"
              step="0.1"
              placeholder="เช่น 55.5"
            >
          </div>

          <div class="field full">
            <label for="screenTime">
              เวลาใช้คอมพิวเตอร์หรือโทรศัพท์ต่อวัน
            </label>
            <select id="screenTime" name="screenTime">
              <option value="">-- เลือกระยะเวลา --</option>
              <option value="less2">น้อยกว่า 2 ชั่วโมง</option>
              <option value="2to4">2–4 ชั่วโมง</option>
              <option value="4to6">4–6 ชั่วโมง</option>
              <option value="more6">มากกว่า 6 ชั่วโมง</option>
            </select>
          </div>

          <div class="field full">
            <label for="neckPain">อาการปวดคอหรือหลังในปัจจุบัน</label>
            <select id="neckPain" name="neckPain">
              <option value="">-- เลือกคำตอบ --</option>
              <option value="none">ไม่มีอาการ</option>
              <option value="mild">เล็กน้อย</option>
              <option value="moderate">ปานกลาง</option>
              <option value="severe">รุนแรง</option>
            </select>
          </div>
        </div>

        <label class="consent" for="consent">
          <input
            type="checkbox"
            id="consent"
            name="consent"
            required
          >
          <span>
            ข้าพเจ้าได้รับคำชี้แจงเกี่ยวกับการวิจัยและยินยอมให้ใช้ข้อมูล
            ตามเอกสารและกระบวนการขอความยินยอมที่ได้รับอนุมัติ
          </span>
        </label>

        <div id="message" role="status" aria-live="polite"></div>

        <div class="actions">
          <a href="index.html" class="btn btn-back">กลับหน้าแรก</a>
          <button type="submit" class="btn btn-next">
            บันทึกข้อมูล →
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    NeckBackRelief.qn · ระบบสนับสนุนโปรแกรมออกกำลังกาย
  </footer>

  <script>
    const form = document.getElementById("profileForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      message.className = "";
      message.style.display = "none";

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const profile = {
        participantId: document.getElementById("participantId").value.trim(),
        age: Number(document.getElementById("age").value),
        gender: document.getElementById("gender").value,
        occupation: document.getElementById("occupation").value,
        height: document.getElementById("height").value,
        weight: document.getElementById("weight").value,
        screenTime: document.getElementById("screenTime").value,
        neckPain: document.getElementById("neckPain").value,
        consent: document.getElementById("consent").checked,
        savedAt: new Date().toISOString()
      };

      if (!profile.participantId) {
        message.textContent = "กรุณากรอกรหัสผู้เข้าร่วมวิจัย";
        message.className = "error";
        return;
      }

      try {
        sessionStorage.setItem(
          "neckBackReliefProfile",
          JSON.stringify(profile)
        );

        message.textContent =
          "บันทึกข้อมูลชั่วคราวในเบราว์เซอร์เรียบร้อยแล้ว " +
          "ขั้นตอนถัดไปจะเปิดใช้งานเมื่อสร้างหน้าถัดไปเสร็จ";

        message.className = "success";
        message.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      } catch (error) {
        message.textContent =
          "ไม่สามารถบันทึกข้อมูลในเบราว์เซอร์ได้ กรุณาลองใหม่อีกครั้ง";

        message.className = "error";
        console.error("Profile save error:", error);
      }
    });
  </script>
</body>
</html>
