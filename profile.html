
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeckBackRelief.qn - Participant Profile</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #253047;
}

header {
  padding: 20px 7%;
  background: white;
  border-bottom: 1px solid #e5eaf2;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 21px;
  font-weight: bold;
}

.brand span {
  color: #5878e8;
}

.step {
  font-size: 13px;
  color: #667085;
}

main {
  max-width: 760px;
  margin: 38px auto;
  padding: 0 18px;
}

.intro {
  margin-bottom: 22px;
}

.tag {
  color: #5878e8;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 10px;
}

h1 {
  font-size: 28px;
  margin: 0 0 12px;
}

p {
  color: #667085;
  line-height: 1.8;
  font-size: 14px;
}

.card {
  background: white;
  border: 1px solid #e5eaf2;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 8px 30px #2530470a;
}

h2 {
  font-size: 18px;
  margin: 0 0 22px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.field {
  margin-bottom: 4px;
}

.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.required {
  color: #d44;
}

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d8deea;
  border-radius: 9px;
  font-size: 14px;
  background: white;
}

input:focus,
select:focus {
  outline: 2px solid #dce4ff;
  border-color: #5878e8;
}

.consent {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: 22px;
  padding: 14px;
  background: #f7f8fc;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.7;
  font-weight: normal;
}

.consent input {
  width: 17px;
  height: 17px;
  margin-top: 4px;
  flex-shrink: 0;
}

.actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 25px;
}

button,
.back {
  padding: 13px 20px;
  border: 0;
  border-radius: 9px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
}

.back {
  background: #f0f2f7;
  color: #4b5568;
}

button {
  background: #5878e8;
  color: white;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#message {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 9px;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.success {
  display: block !important;
  background: #e9f8ef;
  color: #17683a;
}

.error {
  display: block !important;
  background: #fff0f0;
  color: #b42318;
}

footer {
  text-align: center;
  padding: 24px;
  color: #8a92a3;
  font-size: 12px;
}

@media (max-width: 600px) {
  header {
    padding: 17px 20px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .card {
    padding: 20px 16px;
  }

  h1 {
    font-size: 24px;
  }

  .actions {
    flex-direction: column-reverse;
  }

  .actions > * {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    NeckBackRelief<span>.qn</span>
  </div>
  <div class="step">ขั้นตอนที่ 1</div>
</header>

<main>
  <div class="intro">
    <div class="tag">PARTICIPANT REGISTRATION</div>
    <h1>ข้อมูลผู้เข้าร่วมวิจัย</h1>
    <p>
      กรุณากรอกข้อมูลให้ครบถ้วน ข้อมูลจะถูกส่งไปบันทึกในฐานข้อมูลของโครงการวิจัย
    </p>
  </div>

  <div class="card">
    <h2>ข้อมูลส่วนตัว</h2>

    <form id="profileForm">
      <div class="grid">

        <div class="field">
          <label for="participantId">
            รหัสผู้เข้าร่วมวิจัย <span class="required">*</span>
          </label>
          <input id="participantId" required placeholder="เช่น P001">
        </div>

        <div class="field">
          <label for="name">
            ชื่อผู้เข้าร่วมวิจัย <span class="required">*</span>
          </label>
          <input id="name" required>
        </div>

        <div class="field">
          <label for="email">
            อีเมล <span class="required">*</span>
          </label>
          <input id="email" type="email" required>
        </div>

        <div class="field">
          <label for="age">
            อายุ (ปี) <span class="required">*</span>
          </label>
          <input id="age" type="number" min="18" max="100" required>
        </div>

        <div class="field">
          <label for="gender">
            เพศ <span class="required">*</span>
          </label>
          <select id="gender" required>
            <option value="">-- เลือกเพศ --</option>
            <option value="male">ชาย</option>
            <option value="female">หญิง</option>
            <option value="other">อื่น ๆ</option>
            <option value="undisclosed">ไม่ประสงค์ระบุ</option>
          </select>
        </div>

        <div class="field">
          <label for="birthDate">
            วันเกิด <span class="required">*</span>
          </label>
          <input id="birthDate" type="date" required>
        </div>

        <div class="field">
          <label for="occupation">อาชีพ</label>
          <select id="occupation">
            <option value="">-- เลือกอาชีพ --</option>
            <option value="student">นักเรียน/นักศึกษา</option>
            <option value="office">พนักงานสำนักงาน</option>
            <option value="factory">พนักงานโรงงาน</option>
            <option value="other">อื่น ๆ</option>
          </select>
        </div>

        <div class="field">
          <label for="height">ส่วนสูง (ซม.)</label>
          <input id="height" type="number" min="100" max="250" step="0.1">
        </div>

        <div class="field">
          <label for="weight">น้ำหนัก (กก.)</label>
          <input id="weight" type="number" min="20" max="300" step="0.1">
        </div>

        <div class="field">
          <label for="screenTime">เวลาใช้หน้าจอต่อวัน</label>
          <select id="screenTime">
            <option value="">-- เลือกระยะเวลา --</option>
            <option value="less2">น้อยกว่า 2 ชั่วโมง</option>
            <option value="2to4">2–4 ชั่วโมง</option>
            <option value="4to6">4–6 ชั่วโมง</option>
            <option value="more6">มากกว่า 6 ชั่วโมง</option>
          </select>
        </div>

        <div class="field full">
          <label for="neckPain">อาการปวดคอหรือหลัง</label>
          <select id="neckPain">
            <option value="">-- เลือกคำตอบ --</option>
            <option value="none">ไม่มีอาการ</option>
            <option value="mild">เล็กน้อย</option>
            <option value="moderate">ปานกลาง</option>
            <option value="severe">รุนแรง</option>
          </select>
        </div>

      </div>

      <label class="consent" for="consent">
        <input id="consent" type="checkbox" required>
        <span>
          ข้าพเจ้าได้รับคำชี้แจงและยินยอมตามเอกสารและกระบวนการขอความยินยอมที่ได้รับอนุมัติสำหรับโครงการนี้
        </span>
      </label>

      <div id="message" role="status" aria-live="polite"></div>

      <div class="actions">
        <a class="back" href="index.html">กลับหน้าแรก</a>
        <button id="submitButton" type="submit">บันทึกข้อมูล</button>
      </div>
    </form>
  </div>
</main>

<footer>NeckBackRelief.qn · Research Project</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwePE5jxswuwfh2cFIwZwOcSBrNGDV3DBTdhZU81AkGpdrcFdouLXzqN90F8R_p-N8tBg/exec";

const form = document.getElementById("profileForm");
const message = document.getElementById("message");
const button = document.getElementById("submitButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }

  const data = {
    action: "saveProfile",
    userId: document.getElementById("participantId").value.trim(),
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    age: Number(document.getElementById("age").value),
    gender: document.getElementById("gender").value,
    birthDate: document.getElementById("birthDate").value,
    occupation: document.getElementById("occupation").value,
    height: document.getElementById("height").value,
    weight: document.getElementById("weight").value,
    screenTime: document.getElementById("screenTime").value,
    neckPain: document.getElementById("neckPain").value,
    consent: document.getElementById("consent").checked
  };

  button.disabled = true;
  button.textContent = "กำลังส่งข้อมูล...";
  message.className = "";
  message.style.display = "none";

  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    message.textContent =
      "ส่งคำขอแล้ว แต่ยังยืนยันผลจากเซิร์ฟเวอร์ไม่ได้ " +
      "กรุณาตรวจสอบชีต Users ว่ามีข้อมูลรายการใหม่หรือไม่ " +
      "หากไม่มีข้อมูล ให้ตรวจสอบ URL และสิทธิ์ของ Web App";

    message.className = "success";

  } catch (error) {
    console.error(error);

    message.textContent =
      "เกิดข้อผิดพลาดในการส่งคำขอ กรุณาตรวจสอบ URL และการเชื่อมต่ออินเทอร์เน็ต";

    message.className = "error";

  } finally {
    button.disabled = false;
    button.textContent = "บันทึกข้อมูล";
    message.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }
});
</script>

</body>
</html>
